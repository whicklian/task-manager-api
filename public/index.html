<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">

    <!-- ============ CREATE CARD ============ -->
    <div class="card">
      <h1>Task Manager</h1>

      <form id="task-form">
        <input
          type="text"
          id="title-input"
          placeholder="What needs to be done?"
          autocomplete="off"
          required
        />

        <div class="row">
          <select id="status-input">
            <option value="not_started">Not started</option>
            <option value="in_progress">In progress</option>
          </select>
        </div>

        <div class="row two-cols">
          <label>
            <span>Start</span>
            <input type="datetime-local" id="start-input" required />
          </label>
          <label>
            <span>End</span>
            <input type="datetime-local" id="end-input" required />
          </label>
        </div>

        <button type="submit">Add Task</button>
      </form>
    </div>

    <p id="error-state" role="alert" hidden></p>

    <!-- ============ TOOLBAR ============ -->
    <div class="toolbar">
      <input
        type="text"
        id="search-input"
        placeholder="Search by title..."
        autocomplete="off"
      />
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="not_started">Not started</option>
        <option value="in_progress">In progress</option>
        <option value="blocked">Blocked</option>
        <option value="on_hold">On hold</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <!-- ============ BULK ACTION BAR ============ -->
    <div id="bulk-bar" class="bulk-bar" hidden>
      <span id="bulk-count">0 selected</span>
      <select id="bulk-status">
        <option value="">Set status to...</option>
        <option value="not_started">Not started</option>
        <option value="in_progress">In progress</option>
        <option value="blocked">Blocked</option>
        <option value="on_hold">On hold</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <button type="button" id="bulk-apply">Apply</button>
      <button type="button" id="bulk-clear">Clear</button>
    </div>

    <!-- ============ TASK LIST ============ -->
    <ul id="task-list"></ul>
    <p id="empty-state" hidden>No tasks yet. Add one above!</p>

  </div>

  <dialog id="edit-dialog" class="edit-dialog" aria-labelledby="edit-dialog-title">
    <form id="edit-form" class="edit-form">
      <header class="edit-dialog-header">
        <div>
          <p class="edit-dialog-eyebrow">TASK DETAILS</p>
          <h2 id="edit-dialog-title">Edit task</h2>
        </div>
        <button type="button" id="edit-close" class="edit-close" aria-label="Close">×</button>
      </header>

      <label for="edit-title-input">Task title</label>
      <input type="text" id="edit-title-input" maxlength="255" required />

      <label for="edit-status-input">Status</label>
      <select id="edit-status-input" required>
        <option value="not_started">Not started</option>
        <option value="in_progress">In progress</option>
        <option value="blocked">Blocked</option>
        <option value="on_hold">On hold</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>

      <label for="edit-end-input">End time</label>
      <input type="datetime-local" id="edit-end-input" required />
      <p class="edit-help">End time can only be moved later. The start time cannot be changed.</p>

      <div class="edit-start">
        <span>Start time</span>
        <strong id="edit-start-value"></strong>
      </div>

      <footer class="edit-dialog-actions">
        <button type="button" id="edit-cancel" class="cancel-edit-btn">Cancel</button>
        <button type="submit" id="edit-save">Save changes</button>
      </footer>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
